<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Sarpras NBS - Nurmilad</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f4f7f4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 16px;
            line-height: 1.5;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #1a4d2e, #2d6a4f);
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }
        .header .right-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header .back {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 4px 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            font-size: 13px;
            transition: 0.2s;
        }
        .header .back:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .admin-toggle-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .admin-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .admin-toggle-btn.active {
            background: #b03a2e;
            border-color: #b03a2e;
        }

        /* ===== CONTAINER ===== */
        .container {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 16px 0;
            width: 100%;
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            background: #fff;
            padding: 12px 16px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .toolbar .left {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            flex: 1;
        }
        .toolbar .left input,
        .toolbar .left select {
            padding: 8px 14px;
            border: 1px solid #ccc;
            border-radius: 30px;
            font-size: 14px;
            background: #fff;
            min-width: 160px;
        }
        .toolbar .left .filter-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .toolbar .left .filter-row .reset-filter {
            background: transparent;
            border: none;
            color: #b03a2e;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            padding: 4px 8px;
        }
        .toolbar .left .filter-row .reset-filter:hover {
            text-decoration: underline;
        }
        .filter-info {
            font-size: 13px;
            color: #3a5a3a;
            background: #e8f0e8;
            padding: 2px 14px;
            border-radius: 30px;
            display: inline-block;
        }

        .toolbar .right {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .toolbar .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            background: #e0e8e0;
            color: #2a4a3a;
        }
        .toolbar .btn:hover {
            background: #d0d8d0;
        }
        .toolbar .btn-primary {
            background: #2d6a4f;
            color: #fff;
        }
        .toolbar .btn-primary:hover {
            background: #1a4d2e;
        }
        .toolbar .btn-danger {
            background: #b03a2e;
            color: #fff;
        }
        .toolbar .btn-danger:hover {
            background: #8a2e24;
        }
        .toolbar .btn-save {
            background: #5c6b7a;
            color: #fff;
        }
        .toolbar .btn-save.dirty {
            background: #b03a2e;
            animation: pulse 1.5s infinite;
        }
        .toolbar .btn-save.dirty:hover {
            background: #8a2e24;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .toolbar .status {
            font-size: 13px;
            color: #5a6a5a;
            padding: 4px 12px;
            background: #f0f4f0;
            border-radius: 20px;
            white-space: nowrap;
        }
        .toolbar .status.dirty {
            background: #fce4e0;
            color: #b03a2e;
            font-weight: 600;
        }

        /* ===== TABLE WRAPPER ===== */
        .table-wrapper {
            overflow: auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 20px;
            max-height: calc(100vh - 220px);
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 800px;
            border: 1px solid #d0d8d0;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #eaf0ea;
            border-bottom: 2px solid #b0c0b0;
        }

        th, td {
            border: 1px solid #d0d8d0;
            padding: 6px 8px;
            vertical-align: middle;
            text-align: left;
        }

        th {
            background: #eaf0ea;
            font-weight: 600;
            color: #1a3d2e;
            position: relative;
            user-select: none;
            min-width: 60px;
            resize: horizontal;
            overflow: hidden;
            font-size: 12px;
            text-align: center !important;
        }
        th:last-child {
            border-right: 1px solid #d0d8d0;
            resize: none;
        }
        th .sort-icon {
            margin-left: 4px;
            opacity: 0.5;
            font-size: 11px;
        }
        th .sort-icon.active {
            opacity: 1;
            font-weight: bold;
        }
        th::-webkit-resizer {
            background-color: transparent;
            border-right: 2px solid #b0c0b0;
            border-bottom: 2px solid #b0c0b0;
            width: 8px;
            height: 8px;
        }

        td {
            min-height: 32px;
            font-size: 12px;
        }
        tr:last-child td {
            border-bottom: 1px solid #d0d8d0;
        }

        .text-center {
            text-align: center !important;
        }
        .text-right {
            text-align: right !important;
        }

        td select {
            width: 100%;
            padding: 2px 4px;
            border: 1px solid #d0d8d0;
            border-radius: 4px;
            background: #fff;
            font-size: 12px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        td select:focus {
            border-color: #2d6a4f;
            box-shadow: 0 0 0 2px rgba(45, 106, 79, 0.2);
        }
        td select.modified {
            background: #fff3e0;
        }

        td .readonly-value {
            display: block;
            padding: 2px 4px;
            min-height: 22px;
            color: #1a3d2e;
            background: #f4f7f4;
            border-radius: 4px;
            border: 1px solid #e0e8e0;
        }

        .actions-cell {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .actions-cell button {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: normal;
            padding: 2px 4px;
            border-radius: 4px;
            transition: 0.2s;
            line-height: 1.2;
            color: #4a5a4a;
        }
        .actions-cell button.delete-row {
            color: #b03a2e;
        }
        .actions-cell button.delete-row:hover {
            background: #fce4e0;
        }
        .actions-cell button.add-row-below {
            color: #2d6a4f;
        }
        .actions-cell button.add-row-below:hover {
            background: #e0f0e0;
        }

        .no-data {
            text-align: center;
            padding: 40px 16px;
            color: #7a8a7a;
            font-size: 16px;
        }
        .no-data .first-row-btn {
            margin-top: 16px;
            padding: 10px 28px;
            background: #2d6a4f;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-block;
        }
        .no-data .first-row-btn:hover {
            background: #1a4d2e;
            transform: scale(1.02);
        }
        .no-data .first-row-btn:disabled {
            background: #a0b0a0;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 700px) {
            .table-wrapper {
                background: transparent;
                box-shadow: none;
                overflow-x: auto;
                max-height: none;
            }
            table {
                min-width: 600px;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .left,
            .toolbar .right {
                flex-wrap: wrap;
                justify-content: center;
            }
            .toolbar .right {
                justify-content: flex-end;
            }
            .toolbar .status {
                font-size: 12px;
            }
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 400px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 12px;
            color: #fff;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.3s ease;
            text-align: center;
        }
        .toast.success { background: #2d6a4f; }
        .toast.error { background: #c0392b; }
        .toast.info { background: #2c6f9b; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            font-size: 18px;
            color: #1a3d2e;
            font-weight: 600;
        }
        .loading-overlay.hidden { display: none; }
        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #dce4dc;
            border-top-color: #2d6a4f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 14px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            padding: 16px;
            color: #5a6a5a;
            font-size: 13px;
            border-top: 1px solid #dce4dc;
            background: #fff;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>🏗️ Sarpras NBS</h1>
        <div class="right-group">
            <a href="index.html" class="back">← Kembali</a>
            <button class="admin-toggle-btn" id="adminToggle">🔐 Admin</button>
        </div>
    </header>

    <div class="container">
        <!-- TOOLBAR -->
        <div class="toolbar">
            <div class="left">
                <input type="text" id="searchInput" placeholder="🔍 Cari barang, ruang, gedung..." />
                <div class="filter-row">
                    <select id="filterRuang">
                        <option value="">🏢 Semua Ruang</option>
                    </select>
                    <button id="resetFilterBtn" class="reset-filter" style="display:none;">✕ Reset</button>
                </div>
                <span id="filterInfo" class="filter-info" style="display:none;"></span>
            </div>
            <div class="right">
                <span class="status" id="statusIndicator">✅ Semua tersimpan</span>
                <button class="btn btn-save" id="saveBtn">💾 Simpan</button>
                <button class="btn" id="defBtn">📋 Definisi</button>
            </div>
        </div>

        <!-- TABLE -->
        <div class="table-wrapper">
            <table id="inventoryTable">
                <thead>
                    <tr>
                        <th data-field="no" style="cursor:default; width:36px; resize:none;" class="text-center">No</th>
                        <th data-field="namaBarang" style="min-width:100px;" class="text-center">Nama Barang <span class="sort-icon">↕</span></th>
                        <th data-field="jumlahBarang" style="min-width:60px;" class="text-center">Jumlah <span class="sort-icon">↕</span></th>
                        <th data-field="anggaranSatuan" style="min-width:100px;" class="text-center">Anggaran / satuan (Rp.) <span class="sort-icon">↕</span></th>
                        <th data-field="tahunPerolehan" style="min-width:60px;" class="text-center">Tahun <span class="sort-icon">↕</span></th>
                        <th data-field="asalPerolehan" style="min-width:90px;" class="text-center">Sumber Dana <span class="sort-icon">↕</span></th>
                        <th data-field="baik" style="min-width:50px;" class="text-center">Baik <span class="sort-icon">↕</span></th>
                        <th data-field="rusakRingan" style="min-width:50px;" class="text-center">Rusak Ringan <span class="sort-icon">↕</span></th>
                        <th data-field="rusakBerat" style="min-width:50px;" class="text-center">Rusak Berat <span class="sort-icon">↕</span></th>
                        <th data-field="ruang" style="min-width:80px;" class="text-center">Ruang <span class="sort-icon">↕</span></th>
                        <th data-field="lokasiGedung" style="min-width:80px;" class="text-center">Gedung <span class="sort-icon">↕</span></th>
                        <th data-field="jenis" style="min-width:80px;" class="text-center">Jenis <span class="sort-icon">↕</span></th>
                        <th style="width:70px; resize:none;" class="text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="inventoryBody"></tbody>
            </table>
        </div>
        <div id="emptyMessage" class="no-data">Belum ada data. Klik tombol ➕ di kolom Aksi untuk menambahkan.</div>
    </div>

    <div class="footer">&copy; 2026 Nurmilad Boarding School</div>

    <!-- TOAST & LOADING -->
    <div class="toast-container" id="toastContainer"></div>
    <div class="loading-overlay hidden" id="loadingOverlay">
        <div class="spinner"></div>
        <span>Memuat…</span>
    </div>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCkwJDCIjf1o5hQf52UPp13eRsjWPsVGV0",
            authDomain: "sarprasnbs.firebaseapp.com",
            projectId: "sarprasnbs",
            storageBucket: "sarprasnbs.firebasestorage.app",
            messagingSenderId: "604042513677",
            appId: "1:604042513677:web:3d186ae98c9dd8fe09f444"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================================
        // HELPERS
        // ============================================================
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('hidden', !show);
        }

        function formatRupiah(angka) {
            if (angka === undefined || angka === null || isNaN(angka)) return '0';
            return Number(angka).toLocaleString('id-ID');
        }

        function parseAngka(str) {
            if (typeof str === 'string') {
                str = str.replace(/\./g, '').replace(/\s/g, '');
                str = str.replace(',', '.');
            }
            const num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        // ============================================================
        // ADMIN SESSION
        // ============================================================
        const ADMIN_PASS = 'sarpras123';
        const SESSION_KEY = 'nbs_admin_session';
        let isAdmin = false;

        function getAdminSession() {
            return localStorage.getItem(SESSION_KEY) === 'true';
        }

        function setAdminSession(val) {
            localStorage.setItem(SESSION_KEY, val ? 'true' : 'false');
            isAdmin = val;
            updateAdminUI();
        }

        function logoutAdmin() {
            setAdminSession(false);
            showToast('Anda logout dari mode admin', 'info');
            window.location.reload();
        }

        function updateAdminUI() {
            const btn = document.getElementById('adminToggle');
            if (isAdmin) {
                btn.textContent = '🔓 Admin (aktif)';
                btn.classList.add('active');
                btn.onclick = () => {
                    if (confirm('Logout dari mode admin?')) logoutAdmin();
                };
            } else {
                btn.textContent = '🔐 Admin';
                btn.classList.remove('active');
                btn.onclick = () => {
                    const pass = prompt('Masukkan password admin:');
                    if (pass === ADMIN_PASS) {
                        setAdminSession(true);
                        showToast('Mode admin aktif', 'success');
                    } else if (pass !== null) {
                        showToast('Password salah!', 'error');
                    }
                };
            }
            document.querySelectorAll('.delete-row, .add-row-below').forEach(btn => {
                btn.style.display = isAdmin ? 'inline-block' : 'none';
            });
            document.getElementById('defBtn').style.display = isAdmin ? 'inline-block' : 'none';
            document.querySelectorAll('td select').forEach(sel => {
                sel.disabled = !isAdmin;
            });
            const firstBtn = document.getElementById('firstRowBtn');
            if (firstBtn) {
                firstBtn.style.display = isAdmin ? 'inline-block' : 'none';
                firstBtn.disabled = !isAdmin;
            }
        }

        // ============================================================
        // STATE
        // ============================================================
        let sortField = 'namaBarang';
        let sortAsc = true;
        let filterRuang = '';
        let allItems = [];
        let originalData = {};
        let modifiedIds = new Set();
        let isDirty = false;

        // DEFINISI (akan diupdate oleh listener)
        let definitions = {
            ruangan: [],
            gedung: [],
            jenis: [],
            sumberDana: [],
            barang: []
        };
        let ruangNames = [];
        let ruangGedungMap = {};
        let barangJenisMap = {};
        let definitionsReady = false;

        const tbody = document.getElementById('inventoryBody');
        const searchInput = document.getElementById('searchInput');
        const filterRuangSelect = document.getElementById('filterRuang');
        const filterInfo = document.getElementById('filterInfo');
        const resetFilterBtn = document.getElementById('resetFilterBtn');
        const saveBtn = document.getElementById('saveBtn');
        const defBtn = document.getElementById('defBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const emptyMsg = document.getElementById('emptyMessage');

        const inventoryRef = db.collection('inventory');
        let unsubscribeInventory = null;
        let unsubscribeListeners = [];

        // ============================================================
        // FUNGSI UNTUK MENSTART LISTENER DEFINISI (REALTIME)
        // ============================================================
        function startDefinitionListeners() {
            // Listener untuk ruangan
            const unsubRuang = db.collection('ruangan').orderBy('nama').onSnapshot(snap => {
                definitions.ruangan = snap.docs.map(d => ({ id: d.id, nama: d.data().nama, gedung: d.data().gedung || '' }));
                ruangGedungMap = {};
                definitions.ruangan.forEach(r => {
                    ruangGedungMap[r.nama] = r.gedung || '';
                });
                ruangNames = definitions.ruangan.map(r => r.nama).filter(Boolean);
                populateFilterRuang();
                if (definitionsReady) refreshAfterDefinitionChange();
            }, err => showToast('Gagal memuat ruangan: ' + err.message, 'error'));
            unsubscribeListeners.push(unsubRuang);

            // Listener untuk barang
            const unsubBarang = db.collection('barang').orderBy('nama').onSnapshot(snap => {
                definitions.barang = snap.docs.map(d => ({ id: d.id, nama: d.data().nama, jenis: d.data().jenis || '' }));
                barangJenisMap = {};
                definitions.barang.forEach(b => {
                    barangJenisMap[b.nama] = b.jenis || '';
                });
                if (definitionsReady) refreshAfterDefinitionChange();
            }, err => showToast('Gagal memuat barang: ' + err.message, 'error'));
            unsubscribeListeners.push(unsubBarang);

            // Listener untuk sumber dana
            const unsubSumber = db.collection('sumber_dana').orderBy('nama').onSnapshot(snap => {
                definitions.sumberDana = snap.docs.map(d => ({ id: d.id, nama: d.data().nama }));
                if (definitionsReady) refreshAfterDefinitionChange();
            }, err => showToast('Gagal memuat sumber dana: ' + err.message, 'error'));
            unsubscribeListeners.push(unsubSumber);

            // Listener untuk gedung (opsional, untuk dropdown jika ada)
            const unsubGedung = db.collection('gedung').orderBy('nama').onSnapshot(snap => {
                definitions.gedung = snap.docs.map(d => ({ id: d.id, nama: d.data().nama }));
                // tidak perlu refresh, karena gedung hanya digunakan sebagai referensi di ruangan
            }, err => showToast('Gagal memuat gedung: ' + err.message, 'error'));
            unsubscribeListeners.push(unsubGedung);

            definitionsReady = true;
        }

        function refreshAfterDefinitionChange() {
            // Saat definisi berubah, kita perlu refresh tampilan agar nilai jenis/gedung terbaru
            // Tapi kita tidak mau mereset modifiedIds atau isDirty
            // Cukup render ulang dengan data terbaru, tanpa mengubah data inventory
            applyFiltersAndSort();
        }

        // ============================================================
        // LOAD INVENTORY (REALTIME)
        // ============================================================
        function loadInventory() {
            if (unsubscribeInventory) unsubscribeInventory();
            unsubscribeInventory = inventoryRef.onSnapshot(snapshot => {
                allItems = [];
                originalData = {};
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allItems.push({ id: doc.id, data: data });
                    originalData[doc.id] = JSON.parse(JSON.stringify(data));
                });
                modifiedIds.clear();
                isDirty = false;
                updateSaveUI();
                applyFiltersAndSort();
            }, err => {
                console.error('Snapshot error:', err);
                showToast('Gagal memuat data: ' + err.message, 'error');
            });
        }

        // ============================================================
        // FILTER & SORT
        // ============================================================
        function applyFiltersAndSort() {
            const search = searchInput.value.toLowerCase().trim();
            const ruangFilter = filterRuangSelect.value;

            let filtered = allItems.slice();

            if (ruangFilter) {
                filtered = filtered.filter(item => item.data.ruang === ruangFilter);
            }

            if (search) {
                filtered = filtered.filter(item =>
                    (item.data.namaBarang && item.data.namaBarang.toLowerCase().includes(search)) ||
                    (item.data.ruang && item.data.ruang.toLowerCase().includes(search)) ||
                    (item.data.lokasiGedung && item.data.lokasiGedung.toLowerCase().includes(search)) ||
                    (item.data.jenis && item.data.jenis.toLowerCase().includes(search)) ||
                    (item.data.asalPerolehan && item.data.asalPerolehan.toLowerCase().includes(search)) ||
                    (item.data.anggaranSatuan && String(item.data.anggaranSatuan).includes(search))
                );
            }

            if (sortField && sortField !== 'no') {
                filtered.sort((a, b) => {
                    let valA = a.data[sortField] ?? '';
                    let valB = b.data[sortField] ?? '';
                    if (['jumlahBarang', 'tahunPerolehan', 'baik', 'rusakRingan', 'rusakBerat', 'anggaranSatuan'].includes(sortField)) {
                        valA = Number(valA) || 0;
                        valB = Number(valB) || 0;
                        return sortAsc ? valA - valB : valB - valA;
                    } else {
                        valA = String(valA).toLowerCase();
                        valB = String(valB).toLowerCase();
                        return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                    }
                });
            }

            renderItems(filtered);
            updateSortIcons();
            updateFilterInfo(ruangFilter);
            updateAdminUI();
        }

        // ============================================================
        // RENDER
        // ============================================================
        function renderItems(items) {
            tbody.innerHTML = '';
            if (items.length === 0) {
                let btnHtml = '';
                if (isAdmin) {
                    btnHtml = `<button class="first-row-btn" id="firstRowBtn">➕ Tambah Baris Pertama</button>`;
                }
                emptyMsg.innerHTML = `Belum ada data. ${btnHtml}`;
                emptyMsg.style.display = 'block';
                const firstBtn = document.getElementById('firstRowBtn');
                if (firstBtn) firstBtn.addEventListener('click', addFirstRow);
                return;
            }
            emptyMsg.style.display = 'none';

            items.forEach((item, idx) => {
                const tr = document.createElement('tr');
                tr.dataset.id = item.id;

                const selectFields = {
                    namaBarang: { list: definitions.barang, placeholder: 'Pilih Barang' },
                    asalPerolehan: { list: definitions.sumberDana, placeholder: 'Pilih Sumber Dana' },
                    ruang: { list: definitions.ruangan, placeholder: 'Pilih Ruang' }
                };

                const fieldKeys = ['no', 'namaBarang', 'jumlahBarang', 'anggaranSatuan', 'tahunPerolehan',
                    'asalPerolehan', 'baik', 'rusakRingan', 'rusakBerat', 'ruang', 'lokasiGedung', 'jenis'
                ];

                const centerKeys = ['no', 'jumlahBarang', 'tahunPerolehan', 'baik', 'rusakRingan', 'rusakBerat'];

                let html = '';
                fieldKeys.forEach((key) => {
                    let value = item.data[key] ?? '';
                    if (key === 'no') value = idx + 1;
                    if (['jumlahBarang', 'tahunPerolehan', 'baik', 'rusakRingan', 'rusakBerat'].includes(key)) {
                        value = Number(value) || 0;
                    }

                    const isModified = modifiedIds.has(item.id);
                    const extraClass = isModified ? ' modified' : '';
                    let classAttr = '';

                    if (key === 'anggaranSatuan') {
                        classAttr = ' class="text-right' + extraClass + '"';
                        value = formatRupiah(value);
                    } else if (centerKeys.includes(key) || key === 'no') {
                        classAttr = ' class="text-center' + extraClass + '"';
                    } else {
                        classAttr = ' class="' + extraClass + '"';
                    }

                    if (key === 'no') {
                        html += `<td${classAttr}>${value}</td>`;
                    } else if (selectFields[key]) {
                        const selectData = selectFields[key];
                        const optionsHtml = buildSelectOptions(selectData.list, value, selectData.placeholder);
                        const disabled = isAdmin ? '' : 'disabled';
                        html += `<td class="text-center${extraClass}">
                            <select data-key="${key}" data-id="${item.id}" ${disabled}>
                                ${optionsHtml}
                            </select>
                        </td>`;
                    } else if (key === 'lokasiGedung' || key === 'jenis') {
                        // Kolom readonly, tampilkan nilai terbaru dari map
                        let displayVal = '';
                        if (key === 'lokasiGedung') {
                            displayVal = ruangGedungMap[item.data.ruang] || item.data.lokasiGedung || '';
                        } else if (key === 'jenis') {
                            displayVal = barangJenisMap[item.data.namaBarang] || item.data.jenis || '';
                        }
                        html += `<td class="text-center${extraClass}">
                            <span class="readonly-value" data-key="${key}" data-id="${item.id}">${displayVal}</span>
                        </td>`;
                    } else {
                        const editable = isAdmin ? 'contenteditable="true"' : '';
                        html += `<td ${editable} data-key="${key}" data-id="${item.id}"${classAttr}>${value}</td>`;
                    }
                });

                const actionCol = `
                    <td class="text-center">
                        <div class="actions-cell" style="display:${isAdmin ? 'flex' : 'none'};">
                            <button class="add-row-below" data-id="${item.id}" title="Tambah baris di bawah">➕</button>
                            <button class="delete-row" data-id="${item.id}" title="Hapus">🗑️</button>
                        </div>
                    </td>
                `;
                html += actionCol;
                tr.innerHTML = html;
                tbody.appendChild(tr);
            });

            // Event listener untuk SELECT
            tbody.querySelectorAll('td select').forEach(sel => {
                sel.addEventListener('change', onSelectChange);
                if (sel.dataset.key === 'ruang') {
                    sel.addEventListener('change', autoFillGedung);
                }
                if (sel.dataset.key === 'namaBarang') {
                    sel.addEventListener('change', autoFillJenis);
                }
            });

            // Event listener untuk contenteditable
            tbody.querySelectorAll('td[contenteditable="true"]').forEach(td => {
                td.addEventListener('input', onCellInput);
                td.addEventListener('blur', onCellBlur);
                if (!isAdmin) td.contentEditable = 'false';
            });

            // Event listener tombol tambah baris
            tbody.querySelectorAll('.add-row-below').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (!isAdmin) return;
                    const id = e.target.dataset.id;
                    addRowBelow(id);
                });
            });

            // Event listener tombol hapus
            tbody.querySelectorAll('.delete-row').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (!isAdmin) return;
                    const id = e.target.dataset.id;
                    if (confirm('Hapus baris ini?')) deleteItem(id);
                });
            });

            // Setelah render, sinkronkan select dengan data (jika ada)
            tbody.querySelectorAll('tr').forEach(tr => {
                const id = tr.dataset.id;
                const item = allItems.find(it => it.id === id);
                if (!item) return;

                const ruangSelect = tr.querySelector('select[data-key="ruang"]');
                if (ruangSelect && item.data.ruang) {
                    ruangSelect.value = item.data.ruang;
                }
                const barangSelect = tr.querySelector('select[data-key="namaBarang"]');
                if (barangSelect && item.data.namaBarang) {
                    barangSelect.value = item.data.namaBarang;
                }
                // Untuk readonly, sudah diisi dari map saat render
            });
        }

        // ============================================================
        // AUTO-FILL FUNCTIONS
        // ============================================================
        function autoFillGedung(e) {
            const sel = e.target;
            const tr = sel.closest('tr');
            const id = tr.dataset.id;
            const ruangVal = sel.value;
            const gedungSpan = tr.querySelector('span[data-key="lokasiGedung"]');
            if (!gedungSpan) return;

            const gedung = ruangGedungMap[ruangVal] || '';
            gedungSpan.textContent = gedung;

            const item = allItems.find(it => it.id === id);
            if (item) {
                item.data.lokasiGedung = gedung;
                modifiedIds.add(id);
                isDirty = true;
                updateSaveUI();
            }
        }

        function autoFillJenis(e) {
            const sel = e.target;
            const tr = sel.closest('tr');
            const id = tr.dataset.id;
            const barangVal = sel.value;
            const jenisSpan = tr.querySelector('span[data-key="jenis"]');
            if (!jenisSpan) return;

            const jenis = barangJenisMap[barangVal] || '';
            jenisSpan.textContent = jenis;

            const item = allItems.find(it => it.id === id);
            if (item) {
                item.data.jenis = jenis;
                modifiedIds.add(id);
                isDirty = true;
                updateSaveUI();
            }
        }

        // ============================================================
        // EVENT HANDLER SELECT (umum)
        // ============================================================
        function onSelectChange(e) {
            const sel = e.target;
            const id = sel.dataset.id;
            const key = sel.dataset.key;
            const newValue = sel.value;

            const item = allItems.find(it => it.id === id);
            if (!item) return;

            item.data[key] = newValue;
            modifiedIds.add(id);
            sel.classList.add('modified');
            isDirty = true;
            updateSaveUI();

            const orig = originalData[id];
            if (orig && JSON.stringify(orig) === JSON.stringify(item.data)) {
                modifiedIds.delete(id);
                sel.classList.remove('modified');
                if (modifiedIds.size === 0) {
                    isDirty = false;
                    updateSaveUI();
                }
            }
        }

        // ============================================================
        // EVENT HANDLER CONTENTEDITABLE
        // ============================================================
        function onCellInput(e) {
            const td = e.target;
            const id = td.dataset.id;
            const key = td.dataset.key;
            let rawText = td.textContent.trim();

            const item = allItems.find(it => it.id === id);
            if (!item) return;

            if (key === 'anggaranSatuan') {
                const numericValue = parseAngka(rawText);
                item.data[key] = numericValue;
            } else {
                let parsedValue = rawText;
                if (['jumlahBarang', 'tahunPerolehan', 'baik', 'rusakRingan', 'rusakBerat'].includes(key)) {
                    parsedValue = parseFloat(rawText) || 0;
                }
                item.data[key] = parsedValue;
            }

            modifiedIds.add(id);
            td.classList.add('modified');
            isDirty = true;
            updateSaveUI();

            const orig = originalData[id];
            if (orig && JSON.stringify(orig) === JSON.stringify(item.data)) {
                modifiedIds.delete(id);
                td.classList.remove('modified');
                if (modifiedIds.size === 0) {
                    isDirty = false;
                    updateSaveUI();
                }
            }
        }

        function onCellBlur(e) {
            const td = e.target;
            const key = td.dataset.key;
            if (key === 'anggaranSatuan') {
                const id = td.dataset.id;
                const item = allItems.find(it => it.id === id);
                if (item) {
                    const val = item.data[key] || 0;
                    td.textContent = formatRupiah(val);
                }
            }
        }

        // ============================================================
        // ADD ROW BELOW
        // ============================================================
        function addRowBelow(id) {
            if (!isAdmin) {
                showToast('Anda harus login sebagai admin', 'error');
                return;
            }
            const sourceItem = allItems.find(it => it.id === id);
            if (!sourceItem) {
                showToast('Data sumber tidak ditemukan', 'error');
                return;
            }
            const sourceData = sourceItem.data;
            const newData = {
                namaBarang: sourceData.namaBarang || '',
                jumlahBarang: sourceData.jumlahBarang || 0,
                tahunPerolehan: sourceData.tahunPerolehan || 0,
                asalPerolehan: sourceData.asalPerolehan || '',
                baik: sourceData.baik || 0,
                rusakRingan: sourceData.rusakRingan || 0,
                rusakBerat: sourceData.rusakBerat || 0,
                ruang: sourceData.ruang || '',
                lokasiGedung: sourceData.lokasiGedung || '',
                jenis: sourceData.jenis || '',
                anggaranSatuan: sourceData.anggaranSatuan || 0,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            inventoryRef.add(newData).then(() => {
                showToast('Baris baru ditambahkan (copy dari baris ini)', 'success');
            }).catch(err => {
                showToast('Gagal menambah baris: ' + err.message, 'error');
            });
        }

        // ============================================================
        // ADD FIRST ROW
        // ============================================================
        function addFirstRow() {
            if (!isAdmin) {
                showToast('Anda harus login sebagai admin', 'error');
                return;
            }
            const newData = {
                namaBarang: '',
                jumlahBarang: 0,
                tahunPerolehan: 0,
                asalPerolehan: '',
                baik: 0,
                rusakRingan: 0,
                rusakBerat: 0,
                ruang: '',
                lokasiGedung: '',
                jenis: '',
                anggaranSatuan: 0,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            inventoryRef.add(newData).then(() => {
                showToast('Baris pertama ditambahkan', 'success');
            }).catch(err => {
                showToast('Gagal menambah baris: ' + err.message, 'error');
            });
        }

        // ============================================================
        // DELETE ITEM
        // ============================================================
        function deleteItem(id) {
            if (!confirm('Hapus data ini secara permanen?')) return;
            showLoading(true);
            inventoryRef.doc(id).delete().then(() => {
                showToast('Data dihapus', 'success');
            }).catch(err => {
                showToast('Gagal hapus: ' + err.message, 'error');
            }).finally(() => showLoading(false));
        }

        // ============================================================
        // SAVE CHANGES
        // ============================================================
        async function saveChanges() {
            if (!isAdmin) {
                showToast('Anda harus login sebagai admin untuk menyimpan', 'error');
                return;
            }
            if (modifiedIds.size === 0) {
                showToast('Tidak ada perubahan untuk disimpan', 'info');
                return;
            }

            showLoading(true);
            try {
                const batch = db.batch();
                let count = 0;
                for (const id of modifiedIds) {
                    const item = allItems.find(it => it.id === id);
                    if (!item) continue;
                    const ref = inventoryRef.doc(id);
                    batch.update(ref, item.data);
                    count++;
                }
                await batch.commit();
                showToast(`${count} perubahan berhasil disimpan`, 'success');
                modifiedIds.clear();
                isDirty = false;
                allItems.forEach(item => {
                    originalData[item.id] = JSON.parse(JSON.stringify(item.data));
                });
                updateSaveUI();
                document.querySelectorAll('td select.modified, td.modified').forEach(el => el.classList.remove('modified'));
            } catch (err) {
                showToast('Gagal menyimpan: ' + err.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        // ============================================================
        // UPDATE SAVE UI
        // ============================================================
        function updateSaveUI() {
            if (isDirty && modifiedIds.size > 0) {
                saveBtn.classList.add('dirty');
                saveBtn.textContent = `💾 Simpan (${modifiedIds.size})`;
                statusIndicator.textContent = `⚠️ ${modifiedIds.size} perubahan belum disimpan`;
                statusIndicator.className = 'status dirty';
            } else {
                saveBtn.classList.remove('dirty');
                saveBtn.textContent = '💾 Simpan';
                statusIndicator.textContent = '✅ Semua tersimpan';
                statusIndicator.className = 'status';
            }
        }

        // ============================================================
        // SORT ICONS
        // ============================================================
        function updateSortIcons() {
            document.querySelectorAll('th[data-field]').forEach(th => {
                const field = th.dataset.field;
                const icon = th.querySelector('.sort-icon');
                if (!icon) return;
                if (field === sortField) {
                    icon.textContent = sortAsc ? ' ▲' : ' ▼';
                    icon.classList.add('active');
                } else {
                    icon.textContent = ' ↕';
                    icon.classList.remove('active');
                }
            });
        }

        function populateFilterRuang() {
            const sorted = ruangNames.slice().sort((a, b) => a.localeCompare(b));
            filterRuangSelect.innerHTML = '<option value="">🏢 Semua Ruang</option>';
            sorted.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r;
                opt.textContent = r;
                filterRuangSelect.appendChild(opt);
            });
            if (filterRuang) filterRuangSelect.value = filterRuang;
        }

        function buildSelectOptions(list, selectedValue, placeholder = '') {
            const sorted = list.slice().sort((a, b) => a.nama.localeCompare(b.nama));
            let html = `<option value="">${placeholder}</option>`;
            sorted.forEach(item => {
                const sel = (item.nama === selectedValue) ? 'selected' : '';
                html += `<option value="${item.nama}" ${sel}>${item.nama}</option>`;
            });
            return html;
        }

        function updateFilterInfo(ruang) {
            if (ruang) {
                filterInfo.textContent = `Menampilkan: Ruang ${ruang}`;
                filterInfo.style.display = 'inline-block';
                resetFilterBtn.style.display = 'inline-block';
            } else {
                filterInfo.style.display = 'none';
                resetFilterBtn.style.display = 'none';
            }
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        document.querySelectorAll('th[data-field]').forEach(th => {
            th.addEventListener('click', () => {
                const field = th.dataset.field;
                if (field === 'no') return;
                if (sortField === field) sortAsc = !sortAsc;
                else {
                    sortField = field;
                    sortAsc = true;
                }
                applyFiltersAndSort();
            });
        });

        filterRuangSelect.addEventListener('change', () => {
            filterRuang = filterRuangSelect.value;
            applyFiltersAndSort();
        });

        resetFilterBtn.addEventListener('click', () => {
            filterRuangSelect.value = '';
            filterRuang = '';
            applyFiltersAndSort();
        });

        searchInput.addEventListener('input', applyFiltersAndSort);

        saveBtn.addEventListener('click', saveChanges);

        defBtn.addEventListener('click', () => {
            if (!isAdmin) {
                showToast('Harus login sebagai admin', 'error');
                return;
            }
            window.location.href = 'definisi.html';
        });

        window.addEventListener('beforeunload', (e) => {
            if (isDirty && modifiedIds.size > 0) {
                e.preventDefault();
                e.returnValue = 'Ada perubahan yang belum disimpan. Yakin ingin meninggalkan halaman?';
                return e.returnValue;
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        isAdmin = getAdminSession();
        updateAdminUI();

        // 1. Load inventory terlebih dahulu
        loadInventory();

        // 2. Setelah inventory siap, start listener definisi
        // (pastikan applyFiltersAndSort() akan dipanggil saat definisi berubah)
        startDefinitionListeners();

        // 3. Setelah semua siap, kita tandai definitionsReady = true
        // sudah di dalam startDefinitionListeners

        // Tapi karena ada kemungkinan inventory snapshot pertama kali belum selesai,
        // kita tunggu sebentar lalu panggil applyFiltersAndSort() jika perlu
        setTimeout(() => {
            if (allItems.length > 0 && definitionsReady) {
                applyFiltersAndSort();
            }
        }, 1000);

        console.log('Sarpras page loaded dengan realtime definisi.');
    </script>
</body>
</html>
